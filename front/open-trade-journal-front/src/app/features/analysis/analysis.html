<div class="row d-flex align-items-center justify-content-center p-4 m-4 page-container">
  <!-- FILTER -->
  <app-filter class="row col-12 col-xl-10"></app-filter>

  <!-- HEADER -->
  <div class="row col-12 col-xl-10 py-4">
    <app-page-header
      icon="bi-list-columns-reverse"
      title="Trading Analysis"
      subtitle="Explore your results by stock, trade, and profit distribution."
    ></app-page-header>
  </div>

  <!--  NO TRADES -->
  @if (!stats() || !stats()?.pnlHistory?.length) {
    <div class="row col-12 col-xl-10 m-0 p-0">
      <div
        class="div-card d-flex flex-column align-items-center justify-content-center text-center p-5"
      >
        <div class="header-icon mb-4">
          <i class="bi bi-bar-chart-line"></i>
        </div>
        <h2 class="title mb-3">No trading data</h2>
        <div class="subtitle">No trades were found for the selected period.</div>
      </div>
    </div>
  }

  <!-- STATS -->
  @else {
    <div class="row col-12 d-flex align-items-center justify-content-center">
      <div class="row col-12 col-xl-10 m-0 p-0 mb-4">
        <app-histogram
          [pnlHistory]="stats()?.pnlHistory ?? []"
          class="p-0 div-card"
        ></app-histogram>
      </div>
      <div class="row col-12 col-xl-10 m-0 p-0 mb-4">
        <app-stock-ranking [stats]="stats" class="p-0 div-card"> </app-stock-ranking>
      </div>
    </div>
  }
</div>
