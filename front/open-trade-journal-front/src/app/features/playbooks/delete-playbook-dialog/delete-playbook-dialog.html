<div class="dialog p-4 rounded-2">
  <div class="negative">> DELETE PLAYBOOK</div>
  <div class="mt-4">
    <div class="error-bg p-2 rounded-2 my-2 text-center grey small">
      <span class="negative fw-bold">[WARNING]</span> Destructive operation
    </div>
    <p class="grey small p-2">
      Are you sure you want to delete playbook:
      <span class="text-light small">{{ data.name }}</span> ?<br />
      [!] This action cannot be undone.
    </p>
  </div>
  <div class="d-flex align-items-center justify-content-end p-2 mt-2">
    <button type="button" class="mx-2 small p-2 rounded-2 cancel-button" (click)="cancel()">
      CANCEL
    </button>
    <button type="button" class="delete-button rounded-2 p-2 small" (click)="confirm()">
      DELETE
    </button>
  </div>
</div>
