<div class="h-100 p-0 m-0">
  <!-- TERMINAL HEADER -->
  <!-- title -->
  <div class="terminal-header m-4 p-4">
    <div>
      <div class="terminal-title">P&amp;L Performance</div>
      <div class="terminal-subtitle">Cumulative performance</div>
    </div>
  </div>
  <!--sub title -->
  <span
    class="f p-4 m-1 cum-pnl-total"
    [class.text-positive]="cumulativePnl >= 0"
    [class.negative]="cumulativePnl < 0"
  >
    {{ cumulativePnl >= 0 ? '+' : '' }}${{ cumulativePnl | number: '1.2-2' }}
  </span>
  <!-- chart  -->
  <div echarts [options]="chartOptions" class="chart mb-4"></div>
</div>
