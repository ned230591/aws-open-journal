<div class="login-container">

  <!-- Logo -->
  <img
    src="logo.png"
    class="logo"
    alt="OpenTrade Journal"
  />

  <!-- Login -->
  <div class="login-content">

    <div class="login-terminal">


      <!-- Title -->
      <h1 class="title">
        Welcome back
      </h1>

      <!-- Subtitle -->
      <p class="subtitle">
        Sign in to continue tracking your trades.
      </p>

      <!-- Login button -->
      <button
        type="button"
        (click)="loginWithKeycloak()"
      >
        <span>sign-in</span>
      </button>


    </div>

  </div>

</div>
