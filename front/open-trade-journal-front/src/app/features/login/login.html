<div class="login-container">
  <!-- Logo -->
  <img src="logo.png" class="logo" alt="OpenTrade Journal" />
  <!-- Login -->
  <div class="login-content">
    <div class="login-terminal">
      <h1 class="title">Welcome back</h1>
      <p class="subtitle">Sign in to continue tracking your trades.</p>
      <button type="button" (click)="loginWithKeycloak()">
        <span>sign-in</span>
      </button>
    </div>
  </div>
</div>
