services:
  brevo-email-service:
    build:
      context: ./brevo
      dockerfile: Dockerfile
    container_name: keycloak-brevo-email-service
    restart: unless-stopped

    environment:
      BREVO_FROM_EMAIL: openTradeJournal@outlook.com
      BREVO_FROM_NAME: Open Trade Journal Admin
      BREVO_REPLY_TO: openTradeJournal@outlook.com

    expose:
      - "8085"

    networks:
      - keycloak-network
      - open-trade-journal

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8085/api/email/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  nginx:
    image: nginx:1.27-alpine
    container_name: trade-journal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - trade-journal-front
      - keycloak
    networks:
      - open-trade-journal

  certbot:
    image: certbot/certbot:latest
    container_name: trade-journal-certbot
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    networks:
      - open-trade-journal

  # ============================================================
  # TRADE JOURNAL SERVICE
  # ============================================================

  trade-journal-service:
    build:
      context: .
      dockerfile: journal-service/Dockerfile
    image: trade-journal-service:latest
    container_name: trade-journal-service
    restart: unless-stopped

    ports:
      - "8083:8083"

    volumes:
      - trade-journal-service-logs:/app/logs

    depends_on:
      - tradejournal-postgres
      - kafka

    networks:
      - open-trade-journal


  # ============================================================
  # TRADE JOURNAL GATEWAY
  # ============================================================

  trade-journal-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: trade-journal-gateway:latest
    container_name: trade-journal-gateway
    restart: unless-stopped

    ports:
      - "8880:8081"

    volumes:
      - trade-journal-gateway-logs:/app/logs

    depends_on:
      - trade-journal-service

    networks:
      - open-trade-journal

  # ============================================================
  # TRADE JOURNAL FRONT
  # ============================================================

  trade-journal-front:
    build:
      context: ./front/open-trade-journal-front
      dockerfile: Dockerfile
    image: trade-journal-front:latest
    container_name: trade-journal-front
    restart: unless-stopped

    ports:
      - "4200:80"

    volumes:
      - trade-journal-front-logs:/app/logs
    depends_on:
      - trade-journal-gateway


    networks:
      - open-trade-journal


  # ============================================================
  # TRADE JOURNAL POSTGRESQL
  # ============================================================

  tradejournal-postgres:
    image: postgres:17
    container_name: tradejournal-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: tradejournal
      POSTGRES_USER: tradejournal
      POSTGRES_PASSWORD: tradejournal

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - open-trade-journal


  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: apache/kafka:4.0.1
    container_name: tradejournal-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - open-trade-journal


  # ============================================================
  # KEYCLOAK POSTGRESQL
  # ============================================================

  keycloak-postgres:
    image: postgres:16
    container_name: keycloak-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_dev_password

    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

    networks:
      - keycloak-network


  # ============================================================
  # KEYCLOAK
  # ============================================================

  keycloak:
    build:
      context: ./keycloack
      dockerfile: Dockerfile
    container_name: keycloak
    restart: unless-stopped

    command:
      - start-dev
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --hostname=auth-open-trade-journal.duckdns.org

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_password
      BREVO_EMAIL_SERVICE_URL: http://brevo-email-service:8085

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev_password
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HOSTNAME: auth-open-trade-journal.duckdns.org
      KC_SPI_EMAIL_SENDER_PROVIDER_DEFAULT: brevo

    ports:
      - "3389:8080"

    depends_on:
      - keycloak-postgres
      - brevo-email-service

    networks:
      - keycloak-network
      - open-trade-journal


  # ============================================================
  # PROMETHEUS
  # ============================================================

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: trade-journal-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      - trade-journal-service
      - trade-journal-gateway
      - node-exporter

    networks:
      - open-trade-journal


  # ============================================================
  # GRAFANA
  # ============================================================

  grafana:
    image: grafana/grafana:12.1.1
    container_name: trade-journal-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - open-trade-journal


  # ============================================================
  # NODE EXPORTER
  # ============================================================

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: trade-journal-node-exporter
    restart: unless-stopped

    ports:
      - "9100:9100"

    networks:
      - open-trade-journal


  # ============================================================
  # ELASTICSEARCH
  # ============================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: trade-journal-elasticsearch
    restart: unless-stopped

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    networks:
      - open-trade-journal


  # ============================================================
  # LOGSTASH
  # ============================================================

  logstash:
    image: docker.elastic.co/logstash/logstash:9.2.0
    container_name: trade-journal-logstash
    restart: unless-stopped

    depends_on:
      - elasticsearch

    volumes:
      - trade-journal-front-logs:/app/logs/trade-journal-front-logs:ro
      # Trade Journal logs
      - trade-journal-service-logs:/app/logs/trade-journal-service-logs:ro

      # Gateway logs
      - trade-journal-gateway-logs:/app/logs/trade-journal-gateway-logs:ro

      # Logstash pipeline
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro

    networks:
      - open-trade-journal


  # ============================================================
  # KIBANA
  # ============================================================

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.0
    container_name: trade-journal-kibana
    restart: unless-stopped

    ports:
      - "8443:5601"

    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'

    depends_on:
      - elasticsearch

    networks:
      - open-trade-journal


# ==============================================================
# VOLUMES
# ==============================================================

volumes:

  # Trade Journal database
  postgres_data:

  # Keycloak database
  keycloak_postgres_data:

  # Kafka
  kafka_data:
    name: tradejournal_kafka_data

  trade-journal-front-logs:

  # Trade Journal logs
  trade-journal-service-logs:

  # Gateway logs
  trade-journal-gateway-logs:

  # Prometheus
  prometheus-data:

  # Grafana
  grafana-data:

  # Elasticsearch
  elasticsearch-data:


# ==============================================================
# NETWORKS
# ==============================================================

networks:

  keycloak-network:

  open-trade-journal:
