events {}

http {
   upstream grafana {
       server trade-journal-grafana:3000;
   }


   upstream kibana {
       server trade-journal-kibana:5601;
   }
    upstream angular {
        server trade-journal-front:80;
    }

    upstream keycloak {
        server keycloak:8080;
    }

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name open-trade-journal.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 80;
        server_name auth-open-trade-journal.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Angular HTTPS
    server {
        listen 443 ssl;
        server_name open-trade-journal.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/open-trade-journal.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/open-trade-journal.duckdns.org/privkey.pem;

        location / {
            proxy_pass http://angular;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Keycloak HTTPS
    server {
        listen 443 ssl;
        server_name auth-open-trade-journal.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/open-trade-journal.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/open-trade-journal.duckdns.org/privkey.pem;

        location / {
            proxy_pass http://keycloak;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }
    }

    server {
        listen 443 ssl;
        server_name grafana-open-trade-journal.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/open-trade-journal.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/open-trade-journal.duckdns.org/privkey.pem;

        location / {
            proxy_pass http://grafana;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }
    }

    server {
        listen 443 ssl;
        server_name kibana-open-trade-journal.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/open-trade-journal.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/open-trade-journal.duckdns.org/privkey.pem;

        location / {
            proxy_pass http://kibana;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }
    }

    server {
        listen 80;
        server_name grafana-open-trade-journal.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 80;
        server_name kibana-open-trade-journal.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }


}